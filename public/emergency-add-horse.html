<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Horse Addition - ProHorseMatch Admin Tool</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2b2b2b;
            color: white;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #333;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #cdac6e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #444;
            color: white;
            font-size: 16px;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #cdac6e;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
        button:hover {
            background-color: #b99b5e;
        }
        .multi-select {
            height: 100px;
        }
        .result-box {
            margin-top: 30px;
            padding: 15px;
            background-color: #444;
            border-radius: 4px;
            white-space: pre-wrap;
            display: none;
        }
        .warning {
            background-color: #aa3333;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐎 ProHorseMatch Emergency Horse Addition Tool</h1>
        
        <div class="warning">
            This tool is for administrative use only.<br>
            It bypasses normal authentication and should only be used when the main application is experiencing issues.
        </div>
        
        <form id="emergencyHorseForm">
            <div class="form-group">
                <label for="emergencyKey">Emergency Access Key:</label>
                <input type="password" id="emergencyKey" name="emergencyKey" required>
            </div>
            
            <div class="form-group">
                <label for="ownerEmail">Horse Owner Email:</label>
                <input type="email" id="ownerEmail" name="ownerEmail" placeholder="owner@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="name">Horse Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="sex">Sex:</label>
                <select id="sex" name="sex" required>
                    <option value="Gelding">Gelding</option>
                    <option value="Mare">Mare</option>
                    <option value="Stallion">Stallion</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="age">Age (years):</label>
                <input type="number" id="age" name="age" min="0" max="40" required>
            </div>
            
            <div class="form-group">
                <label for="height_hands">Height (hands):</label>
                <input type="number" id="height_hands" name="height_hands" min="10" max="20" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="price_min">Minimum Price:</label>
                <input type="number" id="price_min" name="price_min" min="0" required>
            </div>
            
            <div class="form-group">
                <label for="price_max">Maximum Price:</label>
                <input type="number" id="price_max" name="price_max" min="0" required>
            </div>
            
            <div class="form-group">
                <label for="currency">Currency:</label>
                <select id="currency" name="currency" required>
                    <option value="AUD">AUD</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="location_country">Country:</label>
                <select id="location_country" name="location_country" required>
                    <option value="Australia">Australia</option>
                    <option value="New Zealand">New Zealand</option>
                    <option value="United States">United States</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="Netherlands">Netherlands</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="disciplines">Disciplines (hold Ctrl/Cmd to select multiple):</label>
                <select id="disciplines" name="disciplines" class="multi-select" multiple required>
                    <option value="Dressage">Dressage</option>
                    <option value="Jumping">Jumping</option>
                    <option value="Eventing">Eventing</option>
                    <option value="Western">Western</option>
                    <option value="Racing">Racing</option>
                    <option value="Endurance">Endurance</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="levels">Levels (hold Ctrl/Cmd to select multiple):</label>
                <select id="levels" name="levels" class="multi-select" multiple required>
                    <option value="Novice">Novice</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    <option value="1.20m">1.20m</option>
                    <option value="1.30m">1.30m</option>
                    <option value="1.40m">1.40m</option>
                    <option value="Grand Prix">Grand Prix</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="breeds">Breeds (hold Ctrl/Cmd to select multiple):</label>
                <select id="breeds" name="breeds" class="multi-select" multiple required>
                    <option value="Warmblood">Warmblood</option>
                    <option value="Thoroughbred">Thoroughbred</option>
                    <option value="Arabian">Arabian</option>
                    <option value="Quarter Horse">Quarter Horse</option>
                    <option value="Hanoverian">Hanoverian</option>
                    <option value="Dutch Warmblood">Dutch Warmblood</option>
                    <option value="Holsteiner">Holsteiner</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="sire">Sire (father):</label>
                <input type="text" id="sire" name="sire">
            </div>
            
            <div class="form-group">
                <label for="dam_sire">Dam's Sire (mother's father):</label>
                <input type="text" id="dam_sire" name="dam_sire">
            </div>
            
            <div class="form-group">
                <label for="photos">Photo URLs (one per line):</label>
                <textarea id="photos" name="photos" rows="3" placeholder="https://example.com/horse1.jpg"></textarea>
            </div>
            
            <button type="submit">Add Horse (Emergency Mode)</button>
        </form>
        
        <div id="resultBox" class="result-box"></div>
    </div>
    
    <script>
        document.getElementById('emergencyHorseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.innerHTML = 'Processing...';
            
            // Get form values
            const emergencyKey = document.getElementById('emergencyKey').value;
            const ownerEmail = document.getElementById('ownerEmail').value;
            const name = document.getElementById('name').value;
            const sex = document.getElementById('sex').value;
            const age = parseInt(document.getElementById('age').value);
            const height_hands = parseFloat(document.getElementById('height_hands').value);
            const price_min = parseInt(document.getElementById('price_min').value);
            const price_max = parseInt(document.getElementById('price_max').value);
            const currency = document.getElementById('currency').value;
            const location_country = document.getElementById('location_country').value;
            const description = document.getElementById('description').value;
            const sire = document.getElementById('sire').value;
            const dam_sire = document.getElementById('dam_sire').value;
            
            // Get multi-select values
            const disciplinesSelect = document.getElementById('disciplines');
            const disciplines = Array.from(disciplinesSelect.selectedOptions).map(option => option.value);
            
            const levelsSelect = document.getElementById('levels');
            const levels = Array.from(levelsSelect.selectedOptions).map(option => option.value);
            
            const breedsSelect = document.getElementById('breeds');
            const breeds = Array.from(breedsSelect.selectedOptions).map(option => option.value);
            
            // Parse photos
            const photosText = document.getElementById('photos').value;
            const photos = photosText ? photosText.split('\n').filter(url => url.trim() !== '') : ['/default-horse.jpg'];
            
            // Calculate height in cm
            const height_cm = Math.round(height_hands * 10.16);
            
            // Create the horse data object
            const horseData = {
                owner_email: ownerEmail,
                name,
                sex,
                age,
                height_hands,
                height_cm,
                price_min,
                price_max,
                currency,
                location_country,
                disciplines,
                levels,
                breeds,
                description,
                photos,
                videos: [],
                temperament: "",
                breeding: sire ? `${sire} ${dam_sire ? 'x ' + dam_sire : ''}` : "",
                sire: sire || "",
                dam_sire: dam_sire || ""
            };
            
            try {
                const response = await fetch('/api/horses/emergency-add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        horseData,
                        emergencyKey
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultBox.style.backgroundColor = '#225522';
                    resultBox.innerHTML = 'Success! Horse added with ID: ' + result.id + '\n\n' + JSON.stringify(result, null, 2);
                } else {
                    resultBox.style.backgroundColor = '#552222';
                    resultBox.innerHTML = 'Error: ' + result.message + '\n\n' + JSON.stringify(result, null, 2);
                }
            } catch (error) {
                resultBox.style.backgroundColor = '#552222';
                resultBox.innerHTML = 'Request failed: ' + error.message;
            }
        });
    </script>
</body>
</html>
