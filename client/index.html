<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProHorseMatch</title>
    <meta name="description" content="List horses for free, save searches and have private in app chats with sellers." />
    <!-- Open Graph tags -->
    <meta property="og:title" content="ProHorseMatch - Matching Performance Horses with New Owners" />
    <meta property="og:description" content="List horses for free, save searches and have private in app chats with sellers." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ProHorseMatch">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Instant splash shown before React loads — prevents white screen on PWA resume -->
    <div id="splash" style="
      position:fixed;inset:0;z-index:9999;
      background:#2b2b2b;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      font-family:'Montserrat',sans-serif;
      transition:opacity 0.3s ease;
    ">
      <img src="/icons/icon-192.png" alt="ProHorseMatch" style="width:96px;height:96px;border-radius:20px;margin-bottom:24px;" />
      <div style="color:#c9a96e;font-size:13px;font-weight:600;letter-spacing:0.12em;margin-bottom:28px;text-transform:uppercase;">Pro Horse Match</div>
      <div style="width:36px;height:36px;border:3px solid rgba(201,169,110,0.25);border-top-color:#c9a96e;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Only load Replit banner in browser mode (not PWA standalone mode) -->
    <script>
      if (!window.matchMedia('(display-mode: standalone)').matches) {
        var script = document.createElement('script');
        script.src = 'https://replit.com/public/js/replit-dev-banner.js';
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
